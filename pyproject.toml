[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-medallion"
version = "0.1.0"
description = "Manifest-driven market-data medallion pipelines"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "pyarrow==23.0.1", "xlrd==2.0.2", "certifi==2026.10.23"]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.13"]
dagster = ["dagster==1.12.21", "dagster-webserver==1.12.21"]
dev = ["pytest==8.4.2", "ruff==0.14.2", "build==1.3.0", "setuptools==80.9.0", "wheel==0.45.1"]

[project.scripts]
market-medallion = "market_data_pipeline.cli:main"
market-data = "market_data_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["agents/agent-skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
