name: Python and warehouse contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: aaii_test
          POSTGRES_USER: aaii_test
          # Disposable isolated CI database; production Compose requires a password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U aaii_test -d aaii_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/verify_agent_skills.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
        env:
          MARKET_DATA_TEST_POSTGRES_DSN: postgresql://aaii_test@127.0.0.1:55439/aaii_test
      - run: python -m build --no-isolation
